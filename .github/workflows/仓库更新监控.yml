name: 仓库更新监控
run-name: 监控仓库变更
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

env:
  # 目标仓库
  TARGET_REPO: "cyh92/ok-tv"
  # 快照文件路径（当前仓库内）
  CHECK_FILE: .github/.repo-watch-check.json
  TMP_DIR: ./tmp-watch

jobs:
  check-repo-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 jq
        run: sudo apt-get install -y jq

      - name: 初始化快照文件
        run: |
          mkdir -p $(dirname ${{ env.CHECK_FILE }})
          if [ ! -f ${{ env.CHECK_FILE }} ];then
            echo '{"branches":{},"last_run":""}' > ${{ env.CHECK_FILE }}
          fi

      - name: 获取目标仓库分支列表（修复http状态捕获，公开仓库可选PAT）
        id: fetch_remote
        run: |
          mkdir -p ${{ env.TMP_DIR }}
          API_URL="https://api.github.com/repos/${{ env.TARGET_REPO }}/branches?per_page=100"
          echo "GET $API_URL"

          # 构造header：如果配置了WATCH_PAT才带上token
          HEADER=""
          if [ -n "${{ secrets.WATCH_PAT }}" ]; then
            HEADER="-H Authorization: token ${{ secrets.WATCH_PAT }}"
          fi

          # 正确捕获http状态码（原来写法有管道覆盖bug）
          curl -s -w "\n%{http_code}" $HEADER $API_URL > ${{ env.TMP_DIR }}/resp.tmp
          # 分割：最后一行是http code，前面是响应体
          HTTP_CODE=$(tail -n1 ${{ env.TMP_DIR }}/resp.tmp)
          head -n -1 ${{ env.TMP_DIR }}/resp.tmp > ${{ env.TMP_DIR }}/remote_branches.json

          echo "HTTP_CODE=$HTTP_CODE"
          cat ${{ env.TMP_DIR }}/remote_branches.json

          if [ "$HTTP_CODE" -ne 200 ];then
            echo "❌ GitHub API 请求失败，http code: $HTTP_CODE"
            exit 1
          fi
          IS_ARRAY=$(jq 'if type=="array" then 1 else 0 end' ${{ env.TMP_DIR }}/remote_branches.json)
          if [ "$IS_ARRAY" != "1" ];then
            echo "❌ API 返回不是分支数组，限流/权限错误"
            exit 1
          fi

      - name: 对比分支 & commit，计算变更（修复类型问题）
        id: diff
        run: |
          # 读取旧快照，校验json，失败兜底
          OLD_RAW=$(cat ${{ env.CHECK_FILE }})
          OLD_DATA=$(echo "$OLD_RAW" | jq 'if type == "object" then . else {"branches":{}} end' 2>/dev/null || echo '{"branches":{}}')

          # 生成新分支sha对象
          NEW_BRANCH_OBJ=$(jq 'reduce .[] as $item ({}; .[$item.name] = ($item.commit?.sha // ""))' ${{ env.TMP_DIR }}/remote_branches.json)
          NEW_DATA=$(jq -n --argjson br "$NEW_BRANCH_OBJ" --arg time "$(date -Iseconds)" '{branches:$br, last_run:$time}')

          # 新增分支
          ADDED_BRANCHES=$(jq -n \
            --argjson new "$NEW_BRANCH_OBJ" \
            --argjson old "$OLD_DATA" \
            '$new | keys - ($old.branches | keys) | join(" ")')

          # 删除分支
          REMOVED_BRANCHES=$(jq -n \
            --argjson new "$NEW_BRANCH_OBJ" \
            --argjson old "$OLD_DATA" \
            '$old.branches | keys - ($new | keys) | join(" ")')

          # commit变更分支
          CHANGED_BRANCHES=$(jq -n \
            --argjson new "$NEW_BRANCH_OBJ" \
            --argjson old "$OLD_DATA" \
            '[
              ($old.branches | keys[]) as $k
              | select($new[$k] != null and $old.branches[$k] != $new[$k] and $new[$k] != "")
            ] | join(" ")')

          echo "added_branches=$ADDED_BRANCHES" >> $GITHUB_OUTPUT
          echo "removed_branches=$REMOVED_BRANCHES" >> $GITHUB_OUTPUT
          echo "changed_branches=$CHANGED_BRANCHES" >> $GITHUB_OUTPUT
          echo "new_data<<EOF" >> $GITHUB_OUTPUT
          echo "$NEW_DATA" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if [ -n "$ADDED_BRANCHES$REMOVED_BRANCHES$CHANGED_BRANCHES" ];then
            echo "HAS_UPDATE=true" >> $GITHUB_ENV
          else
            echo "HAS_UPDATE=false" >> $GITHUB_ENV
          fi

      - name: 输出结果
        run: |
          echo "=====检测结果====="
          echo "新增分支：${{ steps.diff.outputs.added_branches }}"
          echo "删除分支：${{ steps.diff.outputs.removed_branches }}"
          echo "代码变更分支：${{ steps.diff.outputs.changed_branches }}"

      - name: 发送通知（企业微信，不需要直接删掉）
        if: 1 == 'true'
        run: |
          curl -s -X POST ${{ secrets.WECOM_WEBHOOK }} \
          -H "Content-Type: application/json" \
          -d '{
            "msgtype": "text",
            "text": {
              "content": "仓库【${{ env.TARGET_REPO }}】变更通知\n新增分支：${{ steps.diff.outputs.added_branches }}\n删除分支：${{ steps.diff.outputs.removed_branches }}\n代码更新分支：${{ steps.diff.outputs.changed_branches }}"
            }
          }'

      - name: 写入新快照
        run: |
          echo '${{ steps.diff.outputs.new_data }}' > ${{ env.CHECK_FILE }}

      - name: 提交推送快照
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.CHECK_FILE }}
          if git diff --cached --quiet;then
            echo "快照无变化，跳过提交"
          else
            git commit -m "chore: update repo watch snapshot [auto]"
            git push
          fi
