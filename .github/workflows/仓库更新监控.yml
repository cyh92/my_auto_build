name: 仓库更新监控
run-name: 监控仓库变更
on:
  schedule:
    - cron: '10 10 * * *'
  workflow_dispatch:

env:
  TARGET_REPO: "fongmi/media"
  CHECK_FILE: .github/.repo-watch-check.json
  TMP_DIR: ./tmp-watch

jobs:
  check-repo-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 jq
        run: sudo apt-get install -y jq

      - name: 初始化快照文件
        run: |
          mkdir -p $(dirname ${{ env.CHECK_FILE }})
          if [ ! -f ${{ env.CHECK_FILE }} ];then
            echo '{"branches":{},"last_run":""}' > ${{ env.CHECK_FILE }}
          fi

      - name: 获取目标仓库分支列表（分页拉全 + 状态码校验）
        id: fetch_remote
        run: |
          mkdir -p ${{ env.TMP_DIR }}
          HEADER=""
          if [ -n "${{ secrets.WATCH_PAT }}" ]; then
            HEADER="-H Authorization: token ${{ secrets.WATCH_PAT }}"
          fi

          echo "[]" > ${{ env.TMP_DIR }}/remote_branches.json
          page=1
          while : ; do
            API_URL="https://api.github.com/repos/${{ env.TARGET_REPO }}/branches?per_page=100&page=${page}"
            echo "GET $API_URL"
            HTTP_CODE=$(curl -s -o ${{ env.TMP_DIR }}/page.json -w "%{http_code}" $HEADER "$API_URL")
            echo "HTTP_CODE=$HTTP_CODE"

            if [ "$HTTP_CODE" -ne 200 ];then
              echo "❌ GitHub API 请求失败，http code: $HTTP_CODE"
              cat ${{ env.TMP_DIR }}/page.json
              exit 1
            fi
            IS_ARRAY=$(jq 'if type=="array" then 1 else 0 end' ${{ env.TMP_DIR }}/page.json)
            if [ "$IS_ARRAY" != "1" ];then
              echo "❌ 返回不是分支数组（限流/权限）"
              cat ${{ env.TMP_DIR }}/page.json
              exit 1
            fi

            # 合并本页数据
            jq -s '.[0] + .[1]' ${{ env.TMP_DIR }}/remote_branches.json ${{ env.TMP_DIR }}/page.json > ${{ env.TMP_DIR }}/merged.json
            mv ${{ env.TMP_DIR }}/merged.json ${{ env.TMP_DIR }}/remote_branches.json

            COUNT=$(jq 'length' ${{ env.TMP_DIR }}/page.json)
            echo "本页分支数：$COUNT"
            [ "$COUNT" -lt 100 ] && break
            page=$((page+1))
            [ "$page" -gt 20 ] && break
          done

          echo "==== 分支总数：$(jq 'length' ${{ env.TMP_DIR }}/remote_branches.json) ===="

      - name: 对比分支 & commit，计算变更
        id: diff
        run: |
          # 旧快照（容错：非法/空 → 空对象）
          OLD_RAW=$(cat ${{ env.CHECK_FILE }} 2>/dev/null || echo '')
          OLD_DATA=$(echo "$OLD_RAW" | jq -c 'if type == "object" then . else {"branches":{}} end' 2>/dev/null || echo '{"branches":{}}')
          echo "旧快照：$OLD_DATA"

          # 新分支哈希表 {分支名: sha}
          NEW_BRANCH_OBJ=$(jq -c 'reduce .[] as $item ({}; .[$item.name] = ($item.commit?.sha // ""))' ${{ env.TMP_DIR }}/remote_branches.json)
          echo "新分支哈希表：$NEW_BRANCH_OBJ"

          # 单次 jq 完成三类差异 + 明细
          RESULT=$(jq -n --argjson old "$OLD_DATA" --argjson new "$NEW_BRANCH_OBJ" '
            ($old.branches // {}) as $ob
            | ($ob | keys) as $ok
            | ($new | keys) as $nk
            | {
                added:   (($nk - $ok) | join(" ")),
                removed: (($ok - $nk) | join(" ")),
                changed: ([ $ok[] | select($new[.] != null and $new[.] != "" and $ob[.] != $new[.]) ] | join(" ")),
                detail:  ([ $ok[] | select($new[.] != null and $new[.] != "" and $ob[.] != $new[.])
                            | "\(.): \($ob[.][0:7]) -> \($new[.][0:7])" ] | join("\n"))
              }')

          ADDED_BRANCHES=$(jq -r '.added' <<< "$RESULT")
          REMOVED_BRANCHES=$(jq -r '.removed' <<< "$RESULT")
          CHANGED_BRANCHES=$(jq -r '.changed' <<< "$RESULT")
          CHANGE_DETAIL=$(jq -r '.detail' <<< "$RESULT")

          # 生成新快照，直接落临时文件（不再走 output 回写）
          jq -n --argjson br "$NEW_BRANCH_OBJ" --arg t "$(date -Iseconds)" '{branches:$br, last_run:$t}' > ${{ env.TMP_DIR }}/new_state.json

          if [ -n "$ADDED_BRANCHES$REMOVED_BRANCHES$CHANGED_BRANCHES" ];then
            HAS_UPDATE=true
          else
            HAS_UPDATE=false
          fi

          echo "added_branches=$ADDED_BRANCHES" >> $GITHUB_OUTPUT
          echo "removed_branches=$REMOVED_BRANCHES" >> $GITHUB_OUTPUT
          echo "changed_branches=$CHANGED_BRANCHES" >> $GITHUB_OUTPUT
          echo "has_update=$HAS_UPDATE" >> $GITHUB_OUTPUT
          {
            echo "change_detail<<EOF"
            echo "$CHANGE_DETAIL"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: 输出结果
        run: |
          echo "=====检测结果====="
          echo "新增分支：[${{ steps.diff.outputs.added_branches }}]"
          echo "删除分支：[${{ steps.diff.outputs.removed_branches }}]"
          echo "代码变更分支：[${{ steps.diff.outputs.changed_branches }}]"
          echo "变更明细："
          echo "${{ steps.diff.outputs.change_detail }}"
          echo "has_update=${{ steps.diff.outputs.has_update }}"

      - name: 发送邮件通知
        if: steps.diff.outputs.has_update == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.139.com
          server_port: 465
          secure: true
          username: cyh92@139.com
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 仓库通知 fongmi/media
          to: cyh92@139.com
          from: cyh92@139.com
          body: |
            新增分支：${{ steps.diff.outputs.added_branches }}
            删除分支：${{ steps.diff.outputs.removed_branches }}
            代码更新分支：${{ steps.diff.outputs.changed_branches }}

            变更明细（旧sha -> 新sha）：
            ${{ steps.diff.outputs.change_detail }}

      - name: 写入新快照
        run: |
          cp ${{ env.TMP_DIR }}/new_state.json ${{ env.CHECK_FILE }}
          echo "=====写入后的快照====="
          cat ${{ env.CHECK_FILE }}

      - name: 提交推送快照
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.CHECK_FILE }}
          if git diff --cached --quiet;then
            echo "快照无变化，跳过提交"
          else
            git commit -m "chore: update repo watch snapshot [auto]"
            git push || { git pull --rebase --autostash && git push; }
          fi
