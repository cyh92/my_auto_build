name: 仓库更新监控（快照存本仓库）
run-name: 监控仓库变更
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

env:
  # 目标仓库 owner/repo
  TARGET_REPO: "fongmi/media"
  # 快照文件路径（放在当前仓库内）
  CHECK_FILE: .github/.repo-watch-check.json
  TMP_DIR: ./tmp-watch

jobs:
  check-repo-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 关键！允许提交推送快照文件
    steps:
      - name: 检出当前仓库（快照存在这里）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 jq
        run: sudo apt-get install -y jq

      - name: 初始化快照文件（不存在就新建）
        run: |
          mkdir -p $(dirname ${{ env.CHECK_FILE }})
          if [ ! -f ${{ env.CHECK_FILE }} ];then
            echo '{"branches":{},"last_run":""}' > ${{ env.CHECK_FILE }}
          fi

      - name: 获取目标仓库分支列表
        id: fetch_remote
        run: |
          mkdir -p ${{ env.TMP_DIR }}
          curl -s -H "Authorization: token ${{ secrets.WATCH_PAT }}" \
            https://api.github.com/repos/${{ env.TARGET_REPO }}/branches?per_page=100 \
            > ${{ env.TMP_DIR }}/remote_branches.json

      - name: 对比分支 & commit，计算变更
        id: diff
        run: |
          # 读取旧快照
          OLD_DATA=$(cat ${{ env.CHECK_FILE }})
          # 构造新快照
          NEW_BRANCH_OBJ=$(jq 'reduce .[] as $item ({}; .[$item.name] = $item.commit.sha)' ${{ env.TMP_DIR }}/remote_branches.json)
          NEW_DATA=$(jq -n --argjson br "$NEW_BRANCH_OBJ" --arg time "$(date -Iseconds)" '{branches:$br, last_run:$time}')

          # 新增分支：在新里存在、旧里不存在
          ADDED_BRANCHES=$(jq -r --argjson new "$NEW_BRANCH_OBJ" --argjson old "$OLD_DATA" '$new | keys - ($old.branches | keys) | join(" ")' <<< "$OLD_DATA")
          # 分支被删除：旧里有、新里没有
          REMOVED_BRANCHES=$(jq -r --argjson new "$NEW_BRANCH_OBJ" --argjson old "$OLD_DATA" '$old.branches | keys - ($new | keys) | join(" ")' <<< "$NEW_BRANCH_OBJ")
          # 代码有更新的分支：两边都存在，sha不一致
          CHANGED_BRANCHES=$(jq -r --argjson new "$NEW_BRANCH_OBJ" --argjson old "$OLD_DATA" '
            [
              ($old.branches | keys[]) as $k
              | select($new[$k] != null and $old.branches[$k] != $new[$k])
            ] | join(" ")
          ' <<< "$OLD_DATA")

          echo "added_branches=$ADDED_BRANCHES" >> $GITHUB_OUTPUT
          echo "removed_branches=$REMOVED_BRANCHES" >> $GITHUB_OUTPUT
          echo "changed_branches=$CHANGED_BRANCHES" >> $GITHUB_OUTPUT
          echo "new_data<<EOF" >> $GITHUB_OUTPUT
          echo "$NEW_DATA" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # 判断是否有更新
          if [ -n "$ADDED_BRANCHES$REMOVED_BRANCHES$CHANGED_BRANCHES" ];then
            echo "HAS_UPDATE=true" >> $GITHUB_ENV
          else
            echo "HAS_UPDATE=false" >> $GITHUB_ENV
          fi

      - name: 输出结果
        run: |
          echo "=====检测结果====="
          echo "新增分支：${{ steps.diff.outputs.added_branches }}"
          echo "删除分支：${{ steps.diff.outputs.removed_branches }}"
          echo "代码变更分支：${{ steps.diff.outputs.changed_branches }}"

      - name: 发送通知（企业微信示例，不需要就删掉）
        if: 1 == 'true'
        run: |
          curl -s -X POST ${{ secrets.WECOM_WEBHOOK }} \
          -H "Content-Type: application/json" \
          -d '{
            "msgtype": "text",
            "text": {
              "content": "仓库【${{ env.TARGET_REPO }}】变更通知\n新增分支：${{ steps.diff.outputs.added_branches }}\n删除分支：${{ steps.diff.outputs.removed_branches }}\n代码更新分支：${{ steps.diff.outputs.changed_branches }}"
            }
          }'

      - name: 写入新快照到 check 文件
        run: |
          echo '${{ steps.diff.outputs.new_data }}' > ${{ env.CHECK_FILE }}

      - name: 提交并推送快照变更
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.CHECK_FILE }}
          if git diff --cached --quiet;then
            echo "快照无变化，跳过提交"
          else
            git commit -m "chore: update repo watch snapshot [auto]"
            git push
          fi
