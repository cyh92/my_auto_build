name: 仓库更新监控
run-name: 监控仓库变更
on:
  schedule:
    - cron: '10 10 * * *'
  workflow_dispatch:

env:
  # 目标仓库
  TARGET_REPO: "fongmi/media"
  # 快照文件路径（当前仓库内）
  CHECK_FILE: .github/.repo-watch-check.json
  TMP_DIR: ./tmp-watch

jobs:
  check-repo-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 jq
        run: sudo apt-get install -y jq

      - name: 初始化快照文件
        run: |
          mkdir -p $(dirname ${{ env.CHECK_FILE }})
          if [ ! -f ${{ env.CHECK_FILE }} ];then
            echo '{"branches":{},"last_run":""}' > ${{ env.CHECK_FILE }}
          fi

      - name: 获取目标仓库分支列表（修复http状态捕获，公开仓库可选PAT）
        id: fetch_remote
        run: |
          mkdir -p ${{ env.TMP_DIR }}
          API_URL="https://api.github.com/repos/${{ env.TARGET_REPO }}/branches?per_page=100"
          echo "GET $API_URL"

          # 构造header：如果配置了WATCH_PAT才带上token
          HEADER=""
          if [ -n "${{ secrets.WATCH_PAT }}" ]; then
            HEADER="-H Authorization: token ${{ secrets.WATCH_PAT }}"
          fi

          # 正确捕获http状态码（原来写法有管道覆盖bug）
          curl -s -w "\n%{http_code}" $HEADER $API_URL > ${{ env.TMP_DIR }}/resp.tmp
          # 分割：最后一行是http code，前面是响应体
          HTTP_CODE=$(tail -n1 ${{ env.TMP_DIR }}/resp.tmp)
          head -n -1 ${{ env.TMP_DIR }}/resp.tmp > ${{ env.TMP_DIR }}/remote_branches.json

          echo "HTTP_CODE=$HTTP_CODE"
          cat ${{ env.TMP_DIR }}/remote_branches.json

          if [ "$HTTP_CODE" -ne 200 ];then
            echo "❌ GitHub API 请求失败，http code: $HTTP_CODE"
            exit 1
          fi
          IS_ARRAY=$(jq 'if type=="array" then 1 else 0 end' ${{ env.TMP_DIR }}/remote_branches.json)
          if [ "$IS_ARRAY" != "1" ];then
            echo "❌ API 返回不是分支数组，限流/权限错误"
            exit 1
          fi

      - name: 对比分支 & commit，计算变更（修复类型问题）
        id: diff
        run: |
          # 读取上一次的快照，不存在则初始化为空对象
          OLD_STATE="{}"
          if [ -f ${{ env.CHECK_FILE }} ]; then
            OLD_STATE=$(cat ${{ env.CHECK_FILE }})
          fi

          # 转换为 {分支名: commit_sha} 结构
          NEW_STATE=$(jq 'reduce .[] as $item ({}; .[$item.name] = $item.commit.sha)' ${{ env.TMP_DIR }}/branches.json)
          echo "$NEW_STATE" > ${{ env.CHECK_FILE }}

          # 提取新旧分支名称数组
          OLD_KEYS=$(jq 'keys' <<< "$OLD_STATE")
          NEW_KEYS=$(jq 'keys' <<< "$NEW_STATE")

          # 新增分支
          ADDED=$(jq -n --argjson old "$OLD_KEYS" --argjson new "$NEW_KEYS" '$new - $old | join(" ")')
          # 删除分支
          REMOVED=$(jq -n --argjson old "$OLD_KEYS" --argjson new "$NEW_KEYS" '$old - $new | join(" ")')
          # 分支存在但是sha不一致 → 代码有更新
          CHANGED=$(jq -n --argjson old "$OLD_STATE" --argjson new "$NEW_STATE" '
            [ $new | keys[] | select($old[.] != $new[.]) ] | join(" ")
          ')

          # 判断是否有任意变更
          HAS_UPDATE="false"
          if [ -n "$ADDED" ] || [ -n "$REMOVED" ] || [ -n "$CHANGED" ]; then
            HAS_UPDATE="true"
          fi

          # 输出变量，供后续邮件使用
          echo "added_branches=$ADDED" >> $GITHUB_OUTPUT
          echo "removed_branches=$REMOVED" >> $GITHUB_OUTPUT
          echo "changed_branches=$CHANGED" >> $GITHUB_OUTPUT
          echo "has_update=$HAS_UPDATE" >> $GITHUB_OUTPUT


      - name: 输出结果
        run: |
          echo "=====检测结果====="
          echo "新增分支：${{ steps.diff.outputs.added_branches }}"
          echo "删除分支：${{ steps.diff.outputs.removed_branches }}"
          echo "代码变更分支：${{ steps.diff.outputs.changed_branches }}"

      - name: 发送邮件通知
        if: steps.diff.outputs.has_update == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.139.com
          server_port: 465
          secure: true
          username: cyh92@139.com
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 仓库通知 fongmi/media
          to: cyh92@139.com
          from: cyh92@139.com
          body: |
            新增分支：${{ steps.diff.outputs.added_branches }}
            删除分支：${{ steps.diff.outputs.removed_branches }}
            变更分支：${{ steps.diff.outputs.changed_branches }}


      - name: 写入新快照
        run: |
          echo '${{ steps.diff.outputs.new_data }}' > ${{ env.CHECK_FILE }}

      - name: 提交推送快照
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.CHECK_FILE }}
          if git diff --cached --quiet;then
            echo "快照无变化，跳过提交"
          else
            git commit -m "chore: update repo watch snapshot [auto]"
            git push
          fi
