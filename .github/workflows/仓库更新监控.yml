name: 仓库更新监控
run-name: 监控仓库变更
on:
  schedule:
    - cron: '10 10 * * *'
  workflow_dispatch:

env:
  # 目标仓库
  TARGET_REPO: "fongmi/media"
  # 快照文件路径（当前仓库内）
  CHECK_FILE: .github/.repo-watch-check.json
  TMP_DIR: ./tmp-watch

jobs:
  check-repo-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 jq
        run: sudo apt-get install -y jq

      - name: 初始化快照文件
        run: |
          mkdir -p $(dirname ${{ env.CHECK_FILE }})
          if [ ! -f ${{ env.CHECK_FILE }} ];then
            echo '{"branches":{},"last_run":""}' > ${{ env.CHECK_FILE }}
          fi

      - name: 获取目标仓库分支列表（修复http状态捕获，公开仓库可选PAT）
        id: fetch_remote
        run: |
          mkdir -p ${{ env.TMP_DIR }}
          API_URL="https://api.github.com/repos/${{ env.TARGET_REPO }}/branches?per_page=100"
          echo "GET $API_URL"

          # 构造header：如果配置了WATCH_PAT才带上token
          HEADER=""
          if [ -n "${{ secrets.WATCH_PAT }}" ]; then
            HEADER="-H Authorization: token ${{ secrets.WATCH_PAT }}"
          fi

          # 正确捕获http状态码（原来写法有管道覆盖bug）
          curl -s -w "\n%{http_code}" $HEADER $API_URL > ${{ env.TMP_DIR }}/resp.tmp
          # 分割：最后一行是http code，前面是响应体
          HTTP_CODE=$(tail -n1 ${{ env.TMP_DIR }}/resp.tmp)
          head -n -1 ${{ env.TMP_DIR }}/resp.tmp > ${{ env.TMP_DIR }}/remote_branches.json

          echo "HTTP_CODE=$HTTP_CODE"
          cat ${{ env.TMP_DIR }}/remote_branches.json

          if [ "$HTTP_CODE" -ne 200 ];then
            echo "❌ GitHub API 请求失败，http code: $HTTP_CODE"
            exit 1
          fi
          IS_ARRAY=$(jq 'if type=="array" then 1 else 0 end' ${{ env.TMP_DIR }}/remote_branches.json)
          if [ "$IS_ARRAY" != "1" ];then
            echo "❌ API 返回不是分支数组，限流/权限错误"
            exit 1
          fi

      - name: 对比分支 & commit，计算变更（修复类型问题）
        id: diff
        run: |
          # 读取旧快照，校验json，失败兜底
          OLD_RAW=$(cat ${{ env.CHECK_FILE }})
          OLD_DATA=$(echo "$OLD_RAW" | jq 'if type == "object" then . else {"branches":{}} end' 2>/dev/null || echo '{"branches":{}}')

          # 生成新分支sha对象
          NEW_BRANCH_OBJ=$(jq 'reduce .[] as $item ({}; .[$item.name] = ($item.commit?.sha // ""))' ${{ env.TMP_DIR }}/remote_branches.json)
          NEW_DATA=$(jq -n --argjson br "$NEW_BRANCH_OBJ" --arg time "$(date -Iseconds)" '{branches:$br, last_run:$time}')

          # 新增分支
          ADDED_BRANCHES=$(jq -n \
            --argjson new "$NEW_BRANCH_OBJ" \
            --argjson old "$OLD_DATA" \
            '$new | keys - ($old.branches | keys) | join(" ")')

          # 删除分支
          REMOVED_BRANCHES=$(jq -n \
            --argjson new "$NEW_BRANCH_OBJ" \
            --argjson old "$OLD_DATA" \
            '$old.branches | keys - ($new | keys) | join(" ")')

          # commit变更分支
          CHANGED_BRANCHES=$(jq -n \
            --argjson new "$NEW_BRANCH_OBJ" \
            --argjson old "$OLD_DATA" \
            '[
              ($old.branches | keys[]) as $k
              | select($new[$k] != null and $old.branches[$k] != $new[$k] and $new[$k] != "")
            ] | join(" ")')

          echo "added_branches=$ADDED_BRANCHES" >> $GITHUB_OUTPUT
          echo "removed_branches=$REMOVED_BRANCHES" >> $GITHUB_OUTPUT
          echo "changed_branches=$CHANGED_BRANCHES" >> $GITHUB_OUTPUT
          echo "new_data<<EOF" >> $GITHUB_OUTPUT
          echo "$NEW_DATA" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if [ -n "$ADDED_BRANCHES$REMOVED_BRANCHES$CHANGED_BRANCHES" ];then
            echo "HAS_UPDATE=true" >> $GITHUB_ENV
          else
            echo "HAS_UPDATE=false" >> $GITHUB_ENV
          fi

      - name: 输出结果
        run: |
          echo "=====检测结果====="
          echo "新增分支：${{ steps.diff.outputs.added_branches }}"
          echo "删除分支：${{ steps.diff.outputs.removed_branches }}"
          echo "代码变更分支：${{ steps.diff.outputs.changed_branches }}"

      - name: 发送邮件通知
        if: env.HAS_UPDATE == 'true'
        env:
          MAIL_USERNAME: cyh92@139.com
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: cyh92@139.com
          SMTP_HOST: smtp.139.com
          SMTP_PORT: 465
          ADDED: ${{ steps.diff.outputs.added_branches }}
          REMOVED: ${{ steps.diff.outputs.removed_branches }}
          CHANGED: ${{ steps.diff.outputs.changed_branches }}
          NEW_DATA: ${{ steps.diff.outputs.new_data }}
        run: |
          python3 - <<'PY'
          import os, json, ssl, smtplib, datetime
          from email.mime.text import MIMEText
          from email.header import Header
          from email.utils import formataddr, formatdate

          host = os.environ.get("SMTP_HOST").strip()
          port = int(os.environ.get("SMTP_PORT").strip())
          user = (os.environ.get("MAIL_USERNAME") or "").strip()
          pwd  = (os.environ.get("MAIL_PASSWORD") or "").strip()
          to   = [x.strip() for x in (os.environ.get("MAIL_TO") or "").replace(";", ",").split(",") if x.strip()]
          repo = os.environ.get("TARGET_REPO", "")

          added   = [x for x in (os.environ.get("ADDED") or "").split() if x]
          removed = [x for x in (os.environ.get("REMOVED") or "").split() if x]
          changed = [x for x in (os.environ.get("CHANGED") or "").split() if x]

          try:
              snap = json.loads(os.environ.get("NEW_DATA") or "{}")
          except Exception:
              snap = {}
          branches = snap.get("branches") or {}

          if not user or not pwd or not to:
              raise SystemExit("邮件参数缺失：MAIL_USERNAME / MAIL_PASSWORD / MAIL_TO")

          subject = f"[仓库更新] {repo} " + "，".join([t for t in [
              f"新增 {len(added)} 个分支" if added else "",
              f"删除 {len(removed)} 个分支" if removed else "",
              f"{len(changed)} 个分支代码更新" if changed else "",
          ] if t])

          def ul(names):
              if not names:
                  return '<p style="margin:4px 0;color:#888">无</p>'
              items = []
              for b in names:
                  sha = branches.get(b, "")
                  url = f"https://github.com/{repo}/commit/{sha}" if sha else f"https://github.com/{repo}/commits/{b}"
                  label = sha[:8] if sha else "查看分支"
                  items.append(f'<li><b>{b}</b> — <a href="{url}">{label}</a></li>')
              return "<ul style='margin:4px 0 12px 18px;padding:0'>" + "".join(items) + "</ul>"

          html = f"""<div style="font-family:-apple-system,Segoe UI,Microsoft YaHei,sans-serif;font-size:14px;color:#222">
          <h3 style="margin:0 0 8px">仓库更新提醒：<a href="https://github.com/{repo}">{repo}</a></h3>
          <p style="margin:0 0 12px;color:#666">检测时间：{datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S')}（UTC）</p>
          <h4 style="margin:12px 0 2px">🆕 新增分支（{len(added)}）</h4>{ul(added)}
          <h4 style="margin:12px 0 2px">📝 代码有更新（{len(changed)}）</h4>{ul(changed)}
          <h4 style="margin:12px 0 2px">🗑 已删除分支（{len(removed)}）</h4>{ul(removed)}
          <p style="margin-top:16px;color:#999;font-size:12px">由 GitHub Actions 自动发送 · 当前快照共 {len(branches)} 个分支</p>
          </div>"""

          msg = MIMEText(html, "html", "utf-8")
          msg["Subject"] = Header(subject, "utf-8")
          msg["From"] = formataddr(("GitHub Actions", user))
          msg["To"] = ", ".join(to)
          msg["Date"] = formatdate(localtime=True)

          if port == 465:
              server = smtplib.SMTP_SSL(host, port, context=ssl.create_default_context(), timeout=30)
          else:
              server = smtplib.SMTP(host, port, timeout=30)
              server.starttls(context=ssl.create_default_context())
          server.login(user, pwd)
          server.sendmail(user, to, msg.as_string())
          server.quit()
          print("✅ 邮件已发送 ->", ", ".join(to))
          PY


      - name: 写入新快照
        run: |
          echo '${{ steps.diff.outputs.new_data }}' > ${{ env.CHECK_FILE }}

      - name: 提交推送快照
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.CHECK_FILE }}
          if git diff --cached --quiet;then
            echo "快照无变化，跳过提交"
          else
            git commit -m "chore: update repo watch snapshot [auto]"
            git push
          fi
