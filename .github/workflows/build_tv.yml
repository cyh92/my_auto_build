name: 构建筱筱影视 APK
on:
  workflow_dispatch:
    inputs:
        add_suffix:
          description: '是否追加包名后缀（.cyh）'
          required: true
          default: false
          type: boolean  # 这就是复选框！
        url:
          description: '请输入仓库地址'
          required: true
          default: 'https://gitee.com/cyh92/ok-tv.git'  
          type: choice
          options:
          - https://gitee.com/cyh92/ok-tv.git
          - https://github.com/cyh92/ok-tv.git
          - https://github.com/qfeng3168/TV.git
        branch:
          description: '请输入要编译的分支名'
          required: true
          default: 'fm-new'
        publishGitee:
          description: '是否同步发布到 Gitee Release'
          required: false
          type: boolean
          default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    # 1. 先拉取【你自己 GitHub 仓库】所有文件（tv/、jks、脚本）
      - name: 检出当前仓库
        uses: actions/checkout@v4
          # 1. 直接用 git clone 拉取 Gitee 仓库（彻底修复来源问题）


      - name: 克隆 Gitee ok-tv 代码 (${{ github.event.inputs.branch }} 分支)
        run: |
          git clone --depth 1 -b ${{ github.event.inputs.branch }} ${{ github.event.inputs.url }} ok-tv

      # 2. 设置 JDK 17
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

    # 👇 新增：安装 Python 3.10（修复 Chaquopy 报错）
      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 复制签名&依赖
        run: |    
          cp -f sign/fm-tv.jks ok-tv/app/fm-tv.jks
           # 定义路径，方便修改
          SRC_AAR_DIR="${GITHUB_WORKSPACE}/media_aars"
          # 这里 third_repo 是你actions/checkout拉第三方仓库指定的path名称
          TARGET_LIBS="${GITHUB_WORKSPACE}/ok-tv/app/libs"
        
          echo "源目录: ${SRC_AAR_DIR}"
          echo "目标目录: ${TARGET_LIBS}"
        
          # 先创建目标文件夹，不存在自动新建
          mkdir -p "${TARGET_LIBS}"
        
          # 复制所有 .aar 文件
          cp -f "${SRC_AAR_DIR}"/*.aar "${TARGET_LIBS}/"
        
          echo "✅ 复制完成，目标目录文件列表："
          ls -la "${TARGET_LIBS}/"

      - name: 配置 APK 签名（终极修复版）
        working-directory: ./ok-tv
        run: |
          # 1. 全新覆盖创建 local.properties
          cat > local.properties << EOF
          storeFile=fm-tv.jks
          keyAlias=key0
          storePassword=123456
          keyPassword=123456
          openid=${{ secrets.OPENID }}
          gitee_token=${{ secrets.MY_GITEE_TOKEN }}
          EOF
          cat local.properties

      # 独立步骤：读取版本号（无警告✅）
      - name: 读取版本号 versionName
        id: version
        working-directory: ./ok-tv
        run: |
          VERSION_NAME=$(grep -m1 "versionName" app/build.gradle | sed -E 's/.*versionName[ =]"([^"]+)".*/\1/')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "✅ 版本号：$VERSION_NAME"
          
      # 4. 清理 + 构建（确保签名一定生效）
      - name: 构建 Release APK
        working-directory: ./ok-tv
        run: |
         chmod +x gradlew
          if [[ "${{ inputs.add_suffix }}" == "true" ]]; then
          sed -i '/buildTypes/,/^}/ { /release {/,/}/ s/}/        applicationIdSuffix ".cyh"\n}/ }' app/build.gradle
          fi
          cat app/build.gradle
          ./gradlew assembleRelease

      # ================= 核心修改 =================
      # 1. 创建 apks 文件夹
      - name: 创建 apks 文件夹
        run: mkdir -p apks

      # 2. 复制所有 release apk 到 apks 目录
      - name: 复制所有 APK 到 apks 目录
        run: |
          find ok-tv/app/build/outputs/apk -name "*.apk" | grep -v debug | xargs -I {} cp {} apks/

      # 3. 读取 apks 目录下所有文件
      - name: 获取所有 APK
        id: apk
        run: echo "files=apks/*" >> $GITHUB_OUTPUT

      # 4. 生成时间
      - name: 获取当前时间
        id: time
        run: |
          echo "datetime=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
          echo "show=$(date +%Y-%m-%d %H:%M:%S)" >> $GITHUB_OUTPUT
      
      - name: 组装Release正文
        id: make_release_body
        run: |
          cat << 'MARKER' >> $GITHUB_OUTPUT
          body<<MY_DELIMITER
          ✅ 手动编译完成
          📦 版本号：v${{ steps.version.outputs.version_name }}
          🔐 已使用 fm-tv.jks 签名
          🌿 分支：${{ github.event.inputs.branch }}
          MY_DELIMITER
          MARKER
      # 5. 上传（从 apks 目录读取，100% 成功）
      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}-${{ steps.time.outputs.datetime }}
           # 👇 这里用 steps.version.outputs.version_name，无警告！
          name: |
            筱筱影视 v${{ steps.version.outputs.version_name }} 
            手动构建版-${{ steps.time.outputs.datetime }} ${{ inputs.add_suffix && '✅ 已加后缀' || '❌ 无后缀' }}
          body: ${{ steps.make_release_body.outputs.body }}
          files: ${{ steps.apk.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          
      - name: Create Release and Use Output
        if: success() && github.event.inputs.publishGitee == 'true'
        id: create_release
        uses: nicennnnnnnlee/action-gitee-release@master
        with:
          gitee_action: create_release
          gitee_owner: cyh92
          gitee_repo: ok-tv
          gitee_token: ${{ secrets.MY_GITEE_TOKEN }}
          gitee_tag_name: v${{ steps.version.outputs.version_name }}-${{ steps.time.outputs.datetime }}
          gitee_release_name: |
            筱筱影视 v${{ steps.version.outputs.version_name }} 
            手动构建版-${{ steps.time.outputs.datetime }} ${{ inputs.add_suffix && '✅ 已加后缀' || '❌ 无后缀' }}
          gitee_release_body: ${{ steps.make_release_body.outputs.body }}
          gitee_target_commitish: ${{ github.event.inputs.branch }}
      
      - name: Upload Additional Assets Using Release ID
        if: success() && github.event.inputs.publishGitee == 'xxxx'
        uses: nicennnnnnnlee/action-gitee-release@master
        with:
          gitee_action: upload_asset
          gitee_owner: cyh92
          gitee_repo: ok-tv
          gitee_token: ${{ secrets.MY_GITEE_TOKEN }}
          gitee_release_id: ${{ steps.create_release.outputs.release-id }}
          gitee_files: |
             apks/*.apk
