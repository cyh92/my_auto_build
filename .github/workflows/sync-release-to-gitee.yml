name: Sync module Release to Gitee

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'GitHub 源 Release tag（默认 module）'
        required: false
        default: 'module'
      github_repo:
        description: 'GitHub 源仓库（owner/repo）'
        required: false
        default: 'FongMi/Release'
      gitee_owner:
        description: 'Gitee 用户名/组织名'
        required: false
        default: 'cyh92'
      gitee_repo:
        description: 'Gitee 仓库名'
        required: false
        default: 'ok-tv'
      gitee_tag:
        description: 'Gitee 目标 tag（留空则与源 tag 相同）'
        required: false
        default: 'module'
      gitee_target_branch:
        description: 'Gitee 创建 Release 用的 target_commitish（默认 master）'
        required: false
        default: 'fongmi'

env:
  DEFAULT_GITEE_OWNER: 'your-gitee-username'
  DEFAULT_GITEE_REPO: 'your-gitee-repo'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Upgrade gh
        run: |
          gh --version || true
          # 确保 gh 为新版，避免 release view 解析异常
          sudo apt-get update -qq && sudo apt-get install -y -qq gh || true
          gh --version

      - name: Resolve parameters
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          INPUT_GH_REPO: ${{ github.event.inputs.github_repo }}
          INPUT_GITEE_OWNER: ${{ github.event.inputs.gitee_owner }}
          INPUT_GITEE_REPO: ${{ github.event.inputs.gitee_repo }}
          INPUT_GITEE_TAG: ${{ github.event.inputs.gitee_tag }}
        run: |
          SOURCE_REPO="${INPUT_GH_REPO:-FongMi/Release}"
          TAG="${INPUT_TAG:-module}"
          TAG=$(echo "$TAG" | tr -d '[:space:]')   # 去掉不可见字符
          echo "Source repo: $SOURCE_REPO, tag: [$TAG]"

          # 失败时打印真实错误，而不是笼统的 not found
          if ! ERR=$(gh release view "$TAG" -R "$SOURCE_REPO" --json tagName 2>&1 >/dev/null); then
            echo "::error::gh release view failed for '$TAG' in $SOURCE_REPO"
            echo "gh error: $ERR"
            exit 1
          fi
          echo "OK: release '$TAG' exists"

          GITEE_OWNER="${INPUT_GITEE_OWNER:-${{ env.DEFAULT_GITEE_OWNER }}}"
          GITEE_REPO="${INPUT_GITEE_REPO:-${{ env.DEFAULT_GITEE_REPO }}}"
          GITEE_TAG="${INPUT_GITEE_TAG:-$TAG}"
          echo "Gitee target: $GITEE_OWNER/$GITEE_REPO, tag: $GITEE_TAG"

          {
            echo "gh_repo=$SOURCE_REPO"
            echo "gh_tag=$TAG"
            echo "gitee_owner=$GITEE_OWNER"
            echo "gitee_repo=$GITEE_REPO"
            echo "gitee_tag=$GITEE_TAG"
            echo "gitee_target_branch=${{ github.event.inputs.gitee_target_branch || 'master' }}"
          } >> "$GITHUB_OUTPUT"

      - name: Get source Release info
        id: gh_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JSON=$(gh release view "${{ steps.resolve.outputs.gh_tag }}" \
            -R "${{ steps.resolve.outputs.gh_repo }}" \
            --json tagName,name,body)
          echo "name=$(echo "$JSON" | jq -r '.name // .tagName')" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            echo "$JSON" | jq -r '.body // ""'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download source assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf ./release_assets && mkdir -p ./release_assets
          gh release download "${{ steps.resolve.outputs.gh_tag }}" \
            --dir ./release_assets \
            --repo "${{ steps.resolve.outputs.gh_repo }}"
          ls -la ./release_assets/

      - name: Ensure Gitee Release exists
        id: gitee_release
        env:
          MY_GITEE_TOKEN: ${{ secrets.MY_GITEE_TOKEN }}
        run: |
          OWNER="${{ steps.resolve.outputs.gitee_owner }}"
          REPO="${{ steps.resolve.outputs.gitee_repo }}"
          TAG="${{ steps.resolve.outputs.gitee_tag }}"
          TARGET="${{ steps.resolve.outputs.gitee_target_branch }}"

          RESP=$(curl -s -w "\n%{http_code}" \
            "https://gitee.com/api/v5/repos/$OWNER/$REPO/releases/tags/$TAG?access_token=$MY_GITEE_TOKEN")
          BODY=$(echo "$RESP" | sed '$d'); CODE=$(echo "$RESP" | tail -n1)

          if [ "$CODE" = "200" ]; then
            RID=$(echo "$BODY" | jq -r '.id')
            echo "Gitee release exists, id=$RID"
          else
            echo "Creating Gitee release '$TAG' (target_commitish=$TARGET)"
            CREATE=$(curl -s -X POST \
              "https://gitee.com/api/v5/repos/$OWNER/$REPO/releases" \
              -H "Content-Type: application/json" \
              -d @- <<EOF
          {
            "access_token": "$MY_GITEE_TOKEN",
            "tag_name": "$TAG",
            "name": "${{ steps.gh_release.outputs.name }}",
            "body": $(echo '${{ steps.gh_release.outputs.body }}' | jq -Rs .),
            "target_commitish": "$TARGET"
          }
          EOF
            )
            RID=$(echo "$CREATE" | jq -r '.id')
            if [ "$RID" = "null" ] || [ -z "$RID" ]; then
              echo "::error::Failed to create Gitee release: $CREATE"
              exit 1
            fi
            echo "Created Gitee release, id=$RID"
          fi
          echo "release_id=$RID" >> "$GITHUB_OUTPUT"

      - name: Upload / overwrite assets on Gitee
        env:
          MY_GITEE_TOKEN: ${{ secrets.MY_GITEE_TOKEN }}
          RID: ${{ steps.gitee_release.outputs.release_id }}
        run: |
          OWNER="${{ steps.resolve.outputs.gitee_owner }}"
          REPO="${{ steps.resolve.outputs.gitee_repo }}"
          BASE="https://gitee.com/api/v5/repos/$OWNER/$REPO/releases/$RID"

          # 拉取 Gitee 侧现有附件列表
          EXISTING=$(curl -s "$BASE/attach_files?access_token=$MY_GITEE_TOKEN")
          echo "$EXISTING" | jq -r '.[]? | "\(.id)\t\(.name)"' || true

          shopt -s nullglob
          for file in ./release_assets/*; do
            NAME=$(basename "$file")
            # 若同名附件已存在，先删除旧附件（滚动 Release 需要覆盖）
            OLD_ID=$(echo "$EXISTING" | jq -r --arg n "$NAME" '.[]? | select(.name==$n) | .id' | head -n1)
            if [ -n "$OLD_ID" ] && [ "$OLD_ID" != "null" ]; then
              echo "Deleting old attachment $NAME (id=$OLD_ID)"
              curl -s -X DELETE \
                "https://gitee.com/api/v5/repos/$OWNER/$REPO/releases/$RID/attach_files/$OLD_ID?access_token=$MY_GITEE_TOKEN" \
                >/dev/null
            fi

            echo "Uploading $NAME"
            CODE=$(curl -s -o /tmp/up.json -w "%{http_code}" -X POST \
              "$BASE/attach_files" \
              -F "access_token=$MY_GITEE_TOKEN" \
              -F "file=@$file")
            if [ "$CODE" != "201" ] && [ "$CODE" != "200" ]; then
              echo "::warning::Upload failed for $NAME (HTTP $CODE): $(cat /tmp/up.json)"
            else
              echo "Uploaded $NAME"
            fi
          done
