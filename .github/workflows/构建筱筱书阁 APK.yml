name: 构建筱筱书阁 APK

on:
  workflow_dispatch:  # 允许手动触发
    inputs: 
      defaultUrl:
        description: '使用仓库'
        required: true
        default: 'https://gitee.com/cyh92/legado.git'  
        type: choice
        options:
          - https://gitee.com/cyh92/legado.git
          - https://github.com/cyh92/legado.git
      defaultBranch:
        description: '使用分支'
        required: true
        default: 'new-dev'     
      publishGitee:
        description: '是否同步发布到 Gitee Release'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - '.last_upstream_commit'  # 当检测到上游更新时触发
    branches:
      - master  # 只在 master 分支上触发

jobs:
  build_readera:
    runs-on: ubuntu-latest
    if: github.repository_owner == github.actor

    steps:
      - name: 拉取构建脚本
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17
    
      - name: 设置构建参数
        shell: bash
        env:
          SECRETS_APP_NAME: "阅读x"
          SECRETS_GIT_URL: ${{ github.event.inputs.defaultUrl }}
          SECRETS_BRANCH: ${{ github.event.inputs.defaultBranch }}
          SECRETS_CHANNEL: "App"
          SECRETS_SUFFIX: "Pro"
          SECRETS_LAUNCH_NAME: "阅读.Pro"
          SECRETS_RENAME: "true"
          SECRETS_MINIFY: "false"
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_ACTOR: ${{ github.actor }}
        run: |
          source $GITHUB_WORKSPACE/action_setenv.sh

      - name: 克隆仓库
        shell: bash
        run: |
          source $GITHUB_WORKSPACE/action_clone.sh

      # - name: Checkout htmlunit-rhino-fork
      #   uses: actions/checkout@v7
      #   with:
      #     repository: skybbk1001/htmlunit-rhino-fork
      #     ref: c758621a0df4ec5687901570dc355c1f98f32652
      #     path: htmlunit-rhino-fork

      # - name: Checkout htmlunit-core-js
      #   uses: actions/checkout@v7
      #   with:
      #     repository: skybbk1001/htmlunit-core-js
      #     ref: e31799f290b50f99fe2cef1f14acd9725f69653c
      #     path: htmlunit-core-js
          
      # - name: Install forked htmlunit-core-js
      #   working-directory: htmlunit-core-js
      #   run: mvn --batch-mode -U clean install -Dmaven.test.skip=true -Dgpg.skip=true -Dmaven.javadoc.skip=true -Dmaven.compiler.showWarnings=false
      
      #- name: 替换直链配置
      #  shell: bash
      #  run: |
      #    mkdir -p $APP_WORKSPACE/app/src/main/assets/defaultData
      #    cp $GITHUB_WORKSPACE/diy/directLinkUpload.json \
      #    $APP_WORKSPACE/app/src/main/assets/defaultData/directLinkUpload.json

      - name: 自定义应用（阅读.A, 共存包）
        shell: bash
        run: |
          source $GITHUB_WORKSPACE/action_app_custom.sh

      - name: （图标 / 默认配置 / JS 增强）
        shell: bash
        run: |
          source $GITHUB_WORKSPACE/action_legado_myself.sh
          
      - name: 生成版本号
        id: date
        run: |
          # 拼接版本前缀+上海时区年月日时分：格式示例 3.26072515
          version="3.$(TZ=Asia/Shanghai date +%y%m%d%H)"
          # 标准写法输出变量到 GitHub Actions 上下文
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 打印当前生成的版本号
          echo "当前版本号: $version"
          sed -i "s/^def version = .*/def version = \"$version\"/" "$APP_WORKSPACE/app/build.gradle"
          cat $APP_WORKSPACE/app/build.gradle
        
      - name: 编译 APK（Release 版本）
        shell: bash
        run: |
          source $GITHUB_WORKSPACE/action_app_build.sh
          app_build
      
      - name: Prepare Release Notes
        run: |
          bash .github/legado/extract-latest-update.sh \
            $APP_WORKSPACE/app/src/main/assets/updateLog.md \
            > "$APP_WORKSPACE/release-notes.md"

      - name: 自动发布 Release
        if: success()
        uses:  softprops/action-gh-release@v1
        with:
          name: ${{ env.APP_NAME }}_app_${{ steps.date.outputs.version }}
          tag_name: ${{ steps.date.outputs.version }}
          body_path: ${{ env.APP_WORKSPACE }}/release-notes.md
          draft: false
          prerelease: false
          files: ${{ env.APP_UPLOAD }}/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ========== 发布Gitee Release（使用MY_GITEE_TOKEN） ==========
      - name: 同步Tag并发布Gitee Release
        if: success() && github.event.inputs.publishGitee == 'true'
        env:
          MY_GITEE_TOKEN: ${{ secrets.MY_GITEE_TOKEN }}
          GITEE_REPO: cyh92/legado
          TAG_NAME: ${{ steps.date.outputs.version }}
          RELEASE_TITLE: ${{ env.APP_NAME }}_app_${{ steps.date.outputs.version }}
          APK_DIR: ${{ env.APP_UPLOAD }}
          TARGET_BRANCH: ${{ github.event.inputs.defaultBranch }}
        run: |
          # 2. 创建Gitee Release
          NOTE_FILE="${{ env.APP_WORKSPACE }}/release-notes.md"
          if [[ ! -f "$NOTE_FILE" ]]; then
            echo "ERROR: 发布日志文件不存在 $NOTE_FILE"
            exit 1
          fi
          # 读取日志并转义双引号
          RELEASE_NOTE_CONTENT=$(cat "$NOTE_FILE" | sed 's/"/\\"/g')
          
          API_URL="https://gitee.com/api/v5/repos/cyh92/legado/releases"
          BODY="自动构建发布版本 ${TAG_NAME}
          构建分支：${TARGET_BRANCH}
          ${RELEASE_NOTE_CONTENT}"
          
          #CREATE_RES=$(curl -X POST --header 'Content-Type: application/json;charset=UTF-8' '${API_URL}' -d '{"access_token":"${{ secrets.MY_GITEE_TOKEN }}","tag_name":"${TAG_NAME}","name":"${RELEASE_TITLE}","body":"${BODY}","target_commitish":"${TARGET_BRANCH}"}')
          CREATE_RES=$(curl -X POST -H "Content-Type: application/json;charset=UTF-8" "${API_URL}" -d "{\"access_token\":\"${{ secrets.MY_GITEE_TOKEN }}\",\"tag_name\":\"${TAG_NAME}\",\"name\":\"${RELEASE_TITLE}\",\"body\":\"${BODY}\",\"target_commitish\":\"${TARGET_BRANCH}\"}")
          # 提取release id
          RELEASE_ID=$(echo "$CREATE_RES" | jq -r '.id')
          if [[ "$RELEASE_ID" == "null" || -z "$RELEASE_ID" ]]; then
            echo "创建Gitee Release失败，返回：$CREATE_RES"
            exit 1
          fi
          echo "Gitee Release 创建成功 ID: $RELEASE_ID"

          # 3. 上传所有APK附件
          for apk in ${APK_DIR}/*.apk; do
            if [ -f "$apk" ]; then
              echo "正在上传附件: $apk"             
              curl -s -X POST \
              -F "access_token=${MY_GITEE_TOKEN}" \
              -F "owner=cyh92" \
              -F "repo=legado" \
              -F "release_id=${RELEASE_ID}" \
              -F "file=@$apk" \
              "$API_URL/${RELEASE_ID}/attach_files"
            echo "上传完成：$apk"
            fi
          done
          echo "所有APK附件上传完成"
