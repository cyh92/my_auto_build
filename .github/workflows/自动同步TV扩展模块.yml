name: 自动同步TV扩展模块

on:
  schedule:
    - cron: '0 18 * * *'   # 每天 UTC 02:00
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'GitHub 源 Release tag'
        required: false
        default: 'module'
      github_repo:
        description: 'GitHub 源仓库'
        required: false
        default: 'FongMi/Release'
      gitee_owner:
        description: 'Gitee 用户名/组织名'
        required: false
        default: 'cyh92'
      gitee_repo:
        description: 'Gitee 仓库名'
        required: false
        default: 'ok-tv'
      gitee_target_branch:
        description: 'Gitee 创建 Release 用的 target_commitish'
        required: false
        default: 'fongmi'

env:
  DEFAULT_GITEE_OWNER: 'cyh92'
  DEFAULT_GITEE_REPO: 'ok-tv'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Upgrade gh (确保 release view/download 正常)
        run: |
          gh --version || true
          sudo apt-get update -qq && sudo apt-get install -y -qq gh || true
          gh --version

      - name: Resolve parameters
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          INPUT_GH_REPO: ${{ github.event.inputs.github_repo }}
          INPUT_GITEE_OWNER: ${{ github.event.inputs.gitee_owner }}
          INPUT_GITEE_REPO: ${{ github.event.inputs.gitee_repo }}
        run: |
          SOURCE_REPO="${INPUT_GH_REPO:-FongMi/Release}"
          TAG="${INPUT_TAG:-module}"
          TAG=$(echo "$TAG" | tr -d '[:space:]')

          echo "Source: $SOURCE_REPO, tag: [$TAG]"
          if ! ERR=$(gh release view "$TAG" -R "$SOURCE_REPO" --json tagName 2>&1 >/dev/null); then
            echo "::error::gh release view failed for '$TAG'"
            echo "gh error: $ERR"
            exit 1
          fi
          echo "OK: release '$TAG' exists"

          GITEE_OWNER="${INPUT_GITEE_OWNER:-${{ env.DEFAULT_GITEE_OWNER }}}"
          GITEE_REPO="${INPUT_GITEE_REPO:-${{ env.DEFAULT_GITEE_REPO }}}"
          GITEE_TAG="$TAG"   # module 直接作为 Gitee tag

          {
            echo "gh_repo=$SOURCE_REPO"
            echo "gh_tag=$TAG"
            echo "gitee_owner=$GITEE_OWNER"
            echo "gitee_repo=$GITEE_REPO"
            echo "gitee_tag=$GITEE_TAG"
            echo "gitee_target_branch=${{ github.event.inputs.gitee_target_branch || 'master' }}"
          } >> "$GITHUB_OUTPUT"

      - name: Get source Release info
        id: gh_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JSON=$(gh release view "${{ steps.resolve.outputs.gh_tag }}" \
            -R "${{ steps.resolve.outputs.gh_repo }}" \
            --json tagName,name,body)
          echo "name=$(echo "$JSON" | jq -r '.name // .tagName')" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            echo "$JSON" | jq -r '.body // ""'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download source assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf ./release_assets && mkdir -p ./release_assets
          gh release download "${{ steps.resolve.outputs.gh_tag }}" \
            --dir ./release_assets \
            --repo "${{ steps.resolve.outputs.gh_repo }}"
          ls -la ./release_assets/

      # 关键：先确保 Gitee Release 存在并拿到 release_id，同时删除同名旧附件
      # 因为 module 是滚动 Release，action 的 upload_asset 只追加不覆盖
      - name: Prepare Gitee Release (ensure exists + delete old assets)
        id: prepare
        env:
          MY_GITEE_TOKEN: ${{ secrets.MY_GITEE_TOKEN }}
        run: |
          OWNER="${{ steps.resolve.outputs.gitee_owner }}"
          REPO="${{ steps.resolve.outputs.gitee_repo }}"
          TAG="${{ steps.resolve.outputs.gitee_tag }}"
          TARGET="${{ steps.resolve.outputs.gitee_target_branch }}"
          BASE="https://gitee.com/api/v5/repos/$OWNER/$REPO"

          echo "Query: $BASE/releases/tags/$TAG"

          # 1. 查询 Release 是否存在（HTTP 状态码与 body 分离）
          TMP=$(mktemp)
          CODE=$(curl -s -o "$TMP" -w "%{http_code}" \
            "$BASE/releases/tags/$TAG?access_token=$MY_GITEE_TOKEN")
          BODY=$(cat "$TMP")
          echo "HTTP $CODE"
          echo "Body preview:"
          head -c 500 "$TMP"; echo

          NEED_CREATE=false
          RID=""

          if [ "$CODE" = "200" ]; then
            # Gitee 对不存在的 tag 可能返回 200 + null，需视为不存在
            RID=$(echo "$BODY" | jq -r '.id // empty' 2>/dev/null || true)
            if [ -z "$RID" ] || [ "$RID" = "null" ]; then
              echo "HTTP 200 but body is null -> treat as not found"
              NEED_CREATE=true
            else
              echo "Gitee release exists, id=$RID"
            fi
          elif [ "$CODE" = "404" ]; then
            echo "HTTP 404 -> not found"
            NEED_CREATE=true
          else
            echo "::error::Unexpected HTTP $CODE when querying Gitee release"
            exit 1
          fi

          # 2. 不存在则创建 Release
          if [ "$NEED_CREATE" = "true" ]; then
            echo "Creating Gitee release '$TAG' (target_commitish=$TARGET)"
            CTMP=$(mktemp)
            CCODE=$(curl -s -o "$CTMP" -w "%{http_code}" -X POST "$BASE/releases" \
              -H "Content-Type: application/json" \
              -d @- <<EOF
          {
            "access_token": "$MY_GITEE_TOKEN",
            "tag_name": "$TAG",
            "name": "${{ steps.gh_release.outputs.name }}",
            "body": $(echo '${{ steps.gh_release.outputs.body }}' | jq -Rs .),
            "target_commitish": "$TARGET"
          }
          EOF
            )
            CBODY=$(cat "$CTMP")
            echo "Create HTTP $CCODE"
            echo "Create body preview:"
            head -c 500 "$CTMP"; echo

            if [ "$CCODE" != "201" ] && [ "$CCODE" != "200" ]; then
              echo "::error::Failed to create Gitee release (HTTP $CCODE)"
              exit 1
            fi

            RID=$(echo "$CBODY" | jq -r '.id // empty' 2>/dev/null || true)
            if [ -z "$RID" ] || [ "$RID" = "null" ]; then
              echo "::error::Create response has no valid id"
              exit 1
            fi
            echo "Created release id=$RID"
          fi

          echo "release_id=$RID" >> "$GITHUB_OUTPUT"

          # 3. 删除同名旧附件（module 为滚动 Release，需覆盖）
          ETMP=$(mktemp)
          curl -s -o "$ETMP" \
            "$BASE/releases/$RID/attach_files?access_token=$MY_GITEE_TOKEN"
          EXISTING=$(cat "$ETMP")
          echo "Existing attachments:"
          jq -r '.[]? | "\(.id)\t\(.name)"' "$ETMP" 2>/dev/null || echo "(none or not json)"

          shopt -s nullglob
          for file in ./release_assets/*; do
            NAME=$(basename "$file")
            OLD_ID=$(echo "$EXISTING" | jq -r --arg n "$NAME" \
              '.[]? | select(.name==$n) | .id' 2>/dev/null | head -n1)
            if [ -n "$OLD_ID" ] && [ "$OLD_ID" != "null" ]; then
              echo "Deleting old attachment: $NAME (id=$OLD_ID)"
              curl -s -X DELETE \
                "$BASE/releases/$RID/attach_files/$OLD_ID?access_token=$MY_GITEE_TOKEN" \
                >/dev/null
            fi
          done
      # - name: Upload assets via action-gitee-release
      #   if: hashFiles('release_assets/*') != ''
      #   uses: nicennnnnnnlee/action-gitee-release@master
      #   with:
      #     gitee_action: upload_asset
      #     gitee_owner: ${{ steps.resolve.outputs.gitee_owner }}
      #     gitee_repo: ${{ steps.resolve.outputs.gitee_repo }}
      #     gitee_token: ${{ secrets.MY_GITEE_TOKEN }}
      #     gitee_release_id: ${{ steps.prepare.outputs.release_id }}
      #     gitee_upload_retry_times: 3
      #     gitee_files: |
      #       release_assets/*
      - name: 上传文件到Gitee发布
        if: hashFiles('release_assets/*') != ''
        env:
          MY_GITEE_TOKEN: ${{ secrets.MY_GITEE_TOKEN }}
          GITEE_OWNER: ${{ steps.resolve.outputs.gitee_owner }}
          GITEE_REPO: ${{ steps.resolve.outputs.gitee_repo }}
          RELEASE_ID: ${{ steps.prepare.outputs.release_id }}
        run: |
          API_URL="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files"
          shopt -s nullglob
          for file in ./release_assets/*; do
            echo "正在上传附件: $file"
            RESP=$(curl -s -X POST \
              -F "access_token=${MY_GITEE_TOKEN}" \
              -F "owner=${GITEE_OWNER}" \
              -F "repo=${GITEE_REPO}" \
              -F "release_id=${RELEASE_ID}" \
              -F "file=@$file" \
              "$API_URL")
            echo "响应: $RESP"
            # 可选：校验返回是否包含 id / name，失败则退出
            NAME=$(echo "$RESP" | jq -r '.name // empty' 2>/dev/null || true)
            if [ -z "$NAME" ]; then
              echo "::warning::上传可能失败: $file"
            else
              echo "上传完成：$NAME"
            fi
          done
          echo "所有附件上传完成"
