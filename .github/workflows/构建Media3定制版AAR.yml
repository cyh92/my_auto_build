name: 构建Media3定制版AAR
on:
  workflow_dispatch:
    inputs:
      repo_source:
          description: 代码仓库来源
          type: choice
          options:
            - GitHub
            - Gitee
            - 自定义地址
          required: true
          default: GitHub
      target_branch:
        description: '输入要编译的分支名'
        required: true
        default: 'release-1.11.0-fongmi'
        type: string
      custom_url:
          description: '自定义仓库地址（仅当上面选择「自定义地址」时生效）'
          required: false
          type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout 当前主仓库代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          
      - name: 检出定制分支源码
        if: inputs.repo_source == 'GitHub'
        uses: actions/checkout@v4
        with:
          repository: FongMi/media
          ref: ${{ inputs.target_branch }}
          fetch-depth: 1
          path: media
          submodules: true

      - name: Clone Gitee 代码
        if: inputs.repo_source == 'Gitee'
        run: |
          # 清空当前目录，避免 git clone . 报错目录非空
          rm -rf ./*
          git clone -b ${{ inputs.target_branch }} --depth 1 https://cyh92:${{ secrets.MY_GITEE_TOKEN }}@gitee.com/cyh92/media.git media
      - name: 克隆自定义仓库代码
        if: inputs.repo_source == '自定义地址'
        run: |
          # 清空当前目录，避免 git clone . 报错目录非空
          rm -rf ./*
          git clone -b ${{ inputs.target_branch }} --depth 1 ${{ inputs.custom_url }} media
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK 36 与 NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" > /dev/null 2>&1
          if [ ! -d "$ANDROID_HOME/ndk/27.0.12077973" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" > /dev/null 2>&1 || true
          fi
          ls "$ANDROID_HOME/ndk" || true

      - name: 设置 NDK 环境变量
        run: |
          if [ -d "$ANDROID_HOME/ndk/27.0.12077973" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          elif [ -d "$ANDROID_HOME/ndk/26.3.11579264" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          fi

      - name: 动态发现全部 lib-* 模块并编译 release aar（含定制 mpvplayer/ui_danmaku/leanback/ffmpeg）
        working-directory: ./media
        run: |
          ls ${GITHUB_WORKSPACE}
          chmod +x gradlew
          PROJECTS=$(./gradlew --no-daemon -q projects 2>/dev/null | grep -oP "Project ':\K[^']+" | grep '^lib-' | sed 's/$/:assembleRelease/' | tr '\n' ' ')
          echo "待编译模块: $PROJECTS"
          if [ -z "$PROJECTS" ]; then echo "::error::未发现任何 lib-* 模块，源码分支可能不对"; exit 1; fi
          ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx5g --stacktrace $PROJECTS

      - name: 收集 aar 
        working-directory: ./media
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/aar-out
          find libraries -path "*/buildout/outputs/aar/*-release.aar" -exec cp {} /tmp/aar-out/ \;
          echo "=== 产物清单 ==="
          ls -la /tmp/aar-out/
          COUNT=$(ls /tmp/aar-out/*.aar 2>/dev/null | wc -l)
          echo "aar 数量: $COUNT"
          if [ "$COUNT" -lt 10 ]; then echo "::error::aar 数量过少（<$COUNT），编译可能不完整"; exit 1; fi

          DEST="${GITHUB_WORKSPACE}/media_aars"
          mkdir -p "${DEST}"
          rsync -av --delete /tmp/aar-out/ "${DEST}/"  
      - name: 提交media_aars变更到仓库
        working-directory: ${{ github.workspace }}
        run: |
          ls
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
          git add media_aars/
          # 判断是否有变更
          if git diff --cached --quiet; then
            echo "ℹ️ media_aars 无文件变更，跳过提交推送"
          else
            git commit -m "🤖 自动更新收集的AAR包 media_aars"
            git push
          fi
